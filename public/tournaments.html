<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>赛事 · TDShogi</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="nav"></header>

  <main class="container">
    <div class="section-title" style="font-size:24px;">棋手赛事</div>

    <!-- 创建赛事 -->
    <div class="card" style="padding:24px;margin-bottom:28px;">
      <div class="section-title">创建单败淘汰赛</div>
      <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;">
        <div style="flex:1;min-width:220px;">
          <div style="font-size:12px;color:var(--text-dim);margin-bottom:6px;">赛事名称</div>
          <input class="input" id="tName" placeholder="如：暑期棋王赛">
        </div>
        <div>
          <div style="font-size:12px;color:var(--text-dim);margin-bottom:6px;">参赛人数</div>
          <select class="select" id="tSize">
            <option value="4">4 人</option>
            <option value="8">8 人</option>
            <option value="16" selected>16 人</option>
          </select>
        </div>
        <button class="btn btn-primary" id="btnCreateTournament">创建赛事</button>
      </div>
    </div>

    <!-- 赛事列表 -->
    <div id="tournamentList"></div>
  </main>

  <div class="toast" id="toast"></div>

  <script src="js/nav.js"></script>
  <script src="js/api.js"></script>
  <script src="js/tournaments.js"></script>
</body>
</html>
