<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>棋谱 · TDShogi</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/board.css">
</head>
<body>
  <header class="nav"></header>

  <main class="container">
    <div class="section-title" style="font-size:24px;">棋谱管理</div>

    <div class="replay-layout">
      <div>
        <div class="card" style="padding:18px;">
          <div class="section-title">对局记录（仅自己的）</div>
          <div id="recordList" style="max-height:78vh;overflow-y:auto;"></div>
        </div>
        <div style="font-size:12px;color:var(--text-dim);margin-top:8px;">
          点击任意棋谱进入「复盘器」，可前进/后退、加书签、写评论、保存变着，并导出 KIF/CSA。
        </div>
      </div>

      <div class="card" style="padding:22px;display:flex;align-items:center;justify-content:center;">
        <div style="text-align:center;color:var(--text-dim);">
          <div style="font-size:48px;margin-bottom:14px;">📜</div>
          <div style="font-size:15px;">从左侧选择棋谱进入复盘器</div>
          <div style="font-size:12px;margin-top:8px;">感想战式的复盘分析</div>
        </div>
      </div>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script src="js/nav.js"></script>
  <script src="js/api.js"></script>
  <script src="js/history.js"></script>
</body>
</html>
