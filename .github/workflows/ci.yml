# TDShogi 无构建步骤，CI 只做「语法/静态检查 + 单元测试 + e2e」。
# e2e 需要真实起服，故单独一个 job；`continue-on-error` 只是为了不让**时序抖动**
# 卡住主流程（e2e 里确有等待窗口类的用例），并非"允许它一直红"——
# 若 e2e 长期失败，请看 job 日志里 `npm run e2e` 的汇总表。
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  static-and-unit:
    name: 静态检查 + 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # .npmrc 设了 ignore-scripts=true：better-sqlite3 走预编译产物，无需 C++ 工具链
      - name: 安装依赖
        run: npm ci
      - name: 语法检查（全部服务端 + 前端脚本）
        run: |
          fail=0
          for f in server.js src/*.js public/js/*.js scripts/*.js tests/*.js; do
            node --check "$f" || { echo "语法错误: $f"; fail=1; }
          done
          exit $fail
      - name: eslint（no-undef 等）
        run: npm run lint
      - name: 单元测试
        run: npm test

  e2e:
    name: e2e 冒烟（起服 3100）
    runs-on: ubuntu-latest
    needs: static-and-unit
    # e2e 脚本对环境较敏感（端口/时序），失败仅作提示，不卡主流程
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # ⚠️ 以前这里是"手工起服 :3100 + 循环跑 scripts/e2e-*.js"，
      #    但 e2e 脚本**写死的端口是 3999**（只有 test-records/test-reconnect 认 PORT 环境变量），
      #    于是这个 job 其实一直在"连不上、全部失败"，又被 continue-on-error 掩盖成了绿。
      #    改成走 `npm run e2e`：它自己起**正确端口 + 正确 ADMIN_PASSWORD** 的隔离实例，
      #    跑完汇总、非零退出码即真实失败。
      - name: 运行 e2e 套件
        run: npm run e2e
